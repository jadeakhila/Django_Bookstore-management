
<!DOCTYPE html>
<html>
<head>
<title>Book Store Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.hero{background:linear-gradient(to right,#1e3c72,#2a5298);color:white;padding:80px;text-align:center;}
.card:hover{transform:scale(1.03);transition:0.3s;}
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/">📚 BookStore</a>
<a href="/cart/" class="btn btn-outline-light">🛒 Cart</a>
<a href="/orders/checkout/" class="btn btn-warning ms-2">Checkout</a>
</div>
</nav>

<div class="hero">
<h1>Book Store Management System</h1>

</div>

<div class="container mt-5">
<div class="row">
{% for book in books %}
<div class="col-md-4 mb-4">
<div class="card shadow p-3">
<h5>{{ book.title }}</h5>
<p>Author: {{ book.author }}</p>
<p>₹{{ book.price }}</p>
<a href="{% url 'add_to_cart' book.id %}" class="btn btn-primary">Add to Cart</a>
</div>
</div>
{% endfor %}
</div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
© 2026 Book Store | Advanced Django Project
</footer>

</body>
</html>
