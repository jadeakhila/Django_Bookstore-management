
<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Cart</title>
</head>
<body class="container mt-4">
<h2>Your Cart</h2>
{% if cart_items %}
<table class="table">
<tr><th>Book</th><th>Price</th><th>Qty</th><th>Action</th></tr>
{% for i in cart_items %}
<tr>
<td>{{ i.book.title }}</td>
<td>₹{{ i.book.price }}</td>
<td>{{ i.quantity }}</td>
<td><a href="{% url 'remove_from_cart' i.id %}" class="btn btn-danger btn-sm">Remove</a></td>
</tr>
{% endfor %}
</table>
<h4>Total: ₹{{ total }}</h4>
<a href="/orders/checkout/" class="btn btn-success">Proceed to Checkout</a>
{% else %}
<p>Cart is empty.</p>
{% endif %}
<a href="/" class="btn btn-secondary">Continue Shopping</a>
</body>
</html>
